name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the scanner rejects a synthetic secret
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          # Generate an ephemeral key at runtime so no secret fixture is tracked.
          openssl genrsa -out "$fixture_dir/known-secret.pem" 1024 >/dev/null 2>&1
          if docker run --rm -v "$fixture_dir:/scan" zricethezav/gitleaks:v8.28.0 \
            dir /scan --redact --no-banner >/dev/null 2>&1; then
            echo "Gitleaks did not reject the synthetic fixture."
            exit 1
          fi
          echo "Gitleaks rejected the synthetic fixture as expected."

      - name: Scan the repository
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            dir /repo --redact --no-banner
